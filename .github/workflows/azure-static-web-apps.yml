name: Deploy no Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Garante que swa/ está em dia com public/ e src/
      - name: Sincronizar swa/
        run: bash scripts/sync-swa.sh

      - name: Testes
        run: npm test

      - name: Publicar
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: swa/app
          api_location: swa/api
          skip_app_build: true
